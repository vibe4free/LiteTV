plugins {
    id 'com.android.application'
}

android {
    namespace = "com.cabletv.player"
    compileSdk 34

    defaultConfig {
        applicationId 'com.cabletv.player'
        minSdk 21
        targetSdk 34
        versionCode project.properties.containsKey('APP_VERSION_CODE') ?
                        Integer.parseInt(project.properties['APP_VERSION_CODE']) : 1
        versionName project.properties.containsKey('APP_VERSION_NAME') ?
                        project.properties['APP_VERSION_NAME'] : '1.0.0'
    }

    signingConfigs {
        release {
            // 从 gradle.properties 读取签名配置；相对路径按项目根目录解析，
            // 否则 file() 会解析到 app/ 下而找不到 keystore。
            storeFile rootProject.file(findProperty('RELEASE_KEYSTORE_PATH') ?: 'keystore/litetv.keystore')
            storePassword findProperty('RELEASE_KEYSTORE_PASSWORD')
            keyAlias findProperty('RELEASE_KEY_ALIAS')
            keyPassword findProperty('RELEASE_KEY_PASSWORD')
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // 按 ABI 拆分 Release APK（arm64 / arm32 / x86_64）
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk false
        }
    }
}

dependencies {
    implementation project(':player')

    // AndroidX
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.leanback:leanback:1.0.0"

    // Configuration persistence (Hawk)
    implementation "com.orhanobut:hawk:2.0.1"

    // JSON parsing
    implementation "com.google.code.gson:gson:2.8.9"

    // HTTP client
    implementation "com.squareup.okhttp3:okhttp:3.12.11"

    // Image loading
    implementation "com.github.bumptech.glide:glide:4.15.1"
}
